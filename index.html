<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>网站维护中</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:#f5f5f5;display:flex;align-items:center;justify-content:center;min-height:100vh}
  .box{text-align:center;padding:60px 40px;background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08);max-width:480px;width:90%}
  h1{font-size:22px;color:#333;margin-bottom:16px}
  p{font-size:15px;color:#666;line-height:1.8}
</style>
</head>
<body>
<div class="box">
  <h1>网站维护中</h1>
  <p>本网站正在进行ICP备案，暂时无法访问。</p>
  <p>备案完成后将恢复正常访问，感谢您的理解。</p>
</div>
</body>
</html>
